server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The bulk screen delete sends up to 1000 ids in the request line
    # (DELETE .../dooh-settings?ids=..., ~9.1 KB worst case), which exceeds nginx's
    # default 8k limit. This file is installed as /etc/nginx/conf.d/default.conf, which
    # the stock image includes inside the http block, so server context is the only
    # place the directive can go here. Guarded by TestNginxAllowsMaxDoohSelector.
    large_client_header_buffers 4 16k;

    # The soft delete sends the selected rows back as a PUT .../dooh-settings body, so up
    # to 1000 whole screen rows (~1 KB each) straddle nginx's default 1 MB limit. Over it
    # nginx answers 413 before the request reaches Go. Guarded by
    # TestNginxAllowsSoftDeletePut, which holds it to handlers.DoohSettingsMaxBody.
    #
    # Server-wide, so it raises the ceiling for POST .../bulk-upload-jobs too — that route
    # keeps its own 50 MB MaxBytesReader, but nginx was the binding limit there. See
    # TECH_DEBT.md; this file is included inside the stock image's http block, so a
    # path-scoped location is the only alternative.
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_header X-New-Access-Token;
        proxy_pass_header X-New-Refresh-Token;

        # Upstream updateAll validates, looks up and history-writes up to 1000 rows in one
        # transaction, and Go's http.DefaultClient imposes no timeout of its own, so
        # nginx's 60s default is the binding limit. A 504 here would report failure on a
        # soft delete that actually committed. Guarded by TestNginxAllowsSoftDeletePut.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
